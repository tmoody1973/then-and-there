name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Build first: it generates the route types the type check includes.
      - run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      - run: bun run typecheck
      - run: bun run test
      # E2E (e2e/) is not run here: it needs a live Convex deployment with published days.
