name: Nightly agent

# The light personal agent (spec 6.2). Its log is public: the job prints counts only.
on:
  schedule:
    - cron: "0 7 * * *" # 2–3 AM Eastern
  workflow_dispatch:
    inputs:
      replay:
        description: "Replay a past batch by name (labeled Replay everywhere), e.g. curiv_biddymason_ver01"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-agent
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run the night
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_WRITE_SECRET: ${{ secrets.CONVEX_WRITE_SECRET }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          META_MODEL_SAM: ${{ vars.META_MODEL_SAM }}
          META_MODEL_SPARK: ${{ vars.META_MODEL_SPARK }}
          META_MODEL_BULK: ${{ vars.META_MODEL_BULK }}
          META_MODEL_EDITOR: ${{ vars.META_MODEL_EDITOR }}
          REPLAY: ${{ inputs.replay }}
        run: |
          if [ -n "$REPLAY" ]; then bun worker/agent/run.ts --replay "$REPLAY" --budget 3
          else bun worker/agent/run.ts --budget 3; fi
